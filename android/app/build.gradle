plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace         'com.portionspot.pos'
    compileSdk        34

    defaultConfig {
        applicationId   'com.portionspot.pos'
        minSdk          23          // Portionspot-v11.5 target
        targetSdk       34
        versionCode     1
        versionName     '1.0'
    }

    buildTypes {
        release {
            minifyEnabled   false   // keep AIDL stubs intact
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug   // replace with release key for store
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Pos v.2.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'   // ActivityResultLauncher
}
